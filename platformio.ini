; ADV-UnitLab - M5 Units and Caps explorer firmware for the M5Stack Cardputer ADV
; https://github.com/RIAL0/ADV-UnitLab
;
; Build (public image, no Bosch BSEC2):   pio run -e cardputer-adv
; Build (private image, with BSEC2 IAQ):  pio run -e cardputer-adv-bsec
; Output: .pio/build/<env>/firmware.bin   (copy to SD card, install with M5Launcher)
;
; The BSEC2 image links Bosch's precompiled libalgobsec.a. Its licence restricts redistributing
; binaries, so CI only compile-checks that environment and never publishes it. Build it locally.

[platformio]
default_envs = cardputer-adv

[common]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -O2
lib_deps =
    m5stack/M5Unified@0.2.29
    m5stack/M5GFX@0.2.36
    m5stack/M5Cardputer@1.1.1
    z3t0/IRremote@4.7.1
    mikalhart/TinyGPSPlus@1.1.0
    https://github.com/boschsensortec/Bosch-BME68x-Library.git#v1.3.40408

[env:cardputer-adv]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_upload.flash_size = 8MB
monitor_speed = 115200
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

[env:cardputer-adv-bsec]
extends = env:cardputer-adv
build_flags =
    ${common.build_flags}
    -DUL_BSEC2
lib_deps =
    ${common.lib_deps}
    https://github.com/boschsensortec/Bosch-BSEC2-Library.git#v1.9.2610
